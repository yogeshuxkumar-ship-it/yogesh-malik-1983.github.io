function route(){
  const slug = (location.hash || "#home").slice(1) || "home";
  const comp = C.find(c=>c.slug===slug);
  const fn = ROUTES[slug];
  let title = "Overview";
  if(comp){ pageEl.innerHTML = renderComponent(comp); title = comp.name; }
  else if(fn){ pageEl.innerHTML = fn(); const f=FOUNDATIONS.find(x=>x.slug===slug); title = f ? f.name : slug==="get-started" ? "Get started" : slug==="components" ? "Components" : "Overview"; }
  else { pageEl.innerHTML = renderHome(); }
  document.title = title + " – HelioNova Design System";
  $$("#sidenav a").forEach(a => { if(a.dataset.slug === (comp||fn ? slug : "home")) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  const section = comp || slug==="components" ? "components" : FOUNDATIONS.some(f=>f.slug===slug) ? "foundations" : slug==="get-started" ? "get-started" : "";
  $$(".topnav a").forEach(a => a.setAttribute("aria-current", a.dataset.top===section ? "true" : "false"));
  $$("input[data-indeterminate]", pageEl).forEach(i => i.indeterminate = true);
  document.body.classList.remove("nav-open");
  $("#menuBtn").setAttribute("aria-expanded","false");
  window.scrollTo(0,0);
  $("#main").focus({preventScroll:true});
}

/* ---------------------------------------------------------
   Behaviour (event delegation)
   --------------------------------------------------------- */
let lastTrigger = null;
function closeOverlays(){
  $$(".hn-overlay.is-open").forEach(o => o.classList.remove("is-open"));
  if(lastTrigger){ lastTrigger.focus(); lastTrigger = null; }
}
function closeDropdowns(except){
  $$(".hn-dropdown.is-open").forEach(d => { if(d!==except){ d.classList.remove("is-open"); const b=d.querySelector("[data-hn-dropdown]"); b && b.setAttribute("aria-expanded","false"); }});
}

document.addEventListener("click", e => {
  const t = e.target;
  const act = t.closest("[data-act]");
  if(act){
    const d = act.closest(".demo"); const sec = d && C.find(c=>c.slug===(location.hash.slice(1)));
    if(act.dataset.act==="toggle"){ const on = d.classList.toggle("show-code"); act.setAttribute("aria-expanded", on); act.lastChild.textContent = on ? "Hide code" : "Show code"; }
    if(act.dataset.act==="copy" && sec){ copyText(sec.sections[+d.dataset.demo].h, "HTML copied"); }
    return;
  }
  const cp = t.closest("[data-copy]");
  if(cp){ copyText(cp.dataset.copy, cp.dataset.copyLabel || "Copied " + cp.dataset.copy); return; }

  const opener = t.closest("[data-hn-open]");
  if(opener){ const o = $(`[data-hn-id="${opener.dataset.hnOpen}"]`); if(o){ lastTrigger = opener; o.classList.add("is-open"); const f = o.querySelector("input,button"); f && f.focus(); } return; }
  const toastBtn = t.closest("[data-hn-toast]");
  if(toastBtn){ const [m,v] = toastBtn.dataset.hnToast.split("|"); toast(m, v); }
  if(t.closest("[data-hn-close]") || t.classList.contains("hn-overlay")){ closeOverlays(); return; }
  if(toastBtn) return;

  const dis = t.closest("[data-hn-dismiss]");
  if(dis){ dis.closest(".hn-alert").remove(); return; }

  const dd = t.closest("[data-hn-dropdown]");
  if(dd){ const w = dd.closest(".hn-dropdown"); const open = !w.classList.contains("is-open"); closeDropdowns(w); w.classList.toggle("is-open", open); dd.setAttribute("aria-expanded", open); if(open){ const first=w.querySelector('[role="menuitem"]'); first && first.focus(); } return; }
  const mi = t.closest('.hn-menu [role="menuitem"]');
  if(mi){ closeDropdowns(); toast(mi.textContent.trim() + (mi.classList.contains("is-danger") ? " needs confirmation" : " opened")); return; }
  if(!t.closest(".hn-dropdown")) closeDropdowns();

  const chip = t.closest(".hn-chip");
  if(chip){ chip.setAttribute("aria-pressed", chip.getAttribute("aria-pressed")==="true" ? "false" : "true"); return; }

  const tab = t.closest('[role="tab"]');
  if(tab){ selectTab(tab); return; }

  if(t.closest(".hn-pagination a")){
    e.preventDefault(); const a = t.closest("a"); if(a.getAttribute("aria-label")) return;
    $$(".hn-pagination a", a.closest(".hn-pagination")).forEach(x=>x.removeAttribute("aria-current")); a.setAttribute("aria-current","page"); return;
  }
  if(t.closest(".hn-breadcrumb a, .hn-card a")){ e.preventDefault(); return; }
});

function selectTab(tab){
  const list = tab.closest('[role="tablist"]'); const root = tab.closest(".hn-tabs");
  const tabs = $$('[role="tab"]', list); const panels = $$('[role="tabpanel"]', root);
  tabs.forEach((x,k) => { const on = x===tab; x.setAttribute("aria-selected", on); x.tabIndex = on ? 0 : -1; if(panels[k]) panels[k].hidden = !on; });
  tab.focus();
}

document.addEventListener("keydown", e => {
  if(e.key==="Escape"){ closeOverlays(); closeDropdowns(); document.body.classList.remove("nav-open"); }
  const tab = e.target.closest && e.target.closest('[role="tab"]');
  if(tab && (e.key==="ArrowRight" || e.key==="ArrowLeft")){
    const tabs = $$('[role="tab"]', tab.closest('[role="tablist"]')); let i = tabs.indexOf(tab);
    i = (i + (e.key==="ArrowRight" ? 1 : -1) + tabs.length) % tabs.length; selectTab(tabs[i]); e.preventDefault();
  }
  const mi = e.target.closest && e.target.closest('.hn-menu [role="menuitem"]');
  if(mi && (e.key==="ArrowDown" || e.key==="ArrowUp")){
    const items = $$('[role="menuitem"]', mi.closest(".hn-menu")); let i = items.indexOf(mi);
    items[(i + (e.key==="ArrowDown" ? 1 : -1) + items.length) % items.length].focus(); e.preventDefault();
  }
  // keep focus inside an open overlay
  const ov = $(".hn-overlay.is-open");
  if(ov && e.key==="Tab"){
    const f = $$("button,input,select,textarea,a[href]", ov).filter(x=>!x.disabled);
    if(!f.length) return;
    if(e.shiftKey && document.activeElement===f[0]){ f[f.length-1].focus(); e.preventDefault(); }
    else if(!e.shiftKey && document.activeElement===f[f.length-1]){ f[0].focus(); e.preventDefault(); }
  }
});

document.addEventListener("input", e => {
  const s = e.target.closest("[data-hn-slider]");
  if(s){ const out = s.closest(".hn-slider").querySelector("output"); out.textContent = s.value + s.dataset.hnSlider; }
});

/* search */
$("#search").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase(); let any = false;
  $$(".nav-group").forEach(g => { let vis = 0; $$("a", g).forEach(a => { const m = !q || a.dataset.name.includes(q); a.hidden = !m; if(m) vis++; }); g.hidden = !vis; if(vis) any = true; });
  $(".nav-empty").hidden = any;
});
$("#search").addEventListener("keydown", e => {
  if(e.key==="Enter"){ const a = $$("#sidenav a").find(x=>!x.hidden && !x.closest(".nav-group").hidden && e.target.value.trim()); if(a){ location.hash = a.dataset.slug; e.target.value=""; e.target.dispatchEvent(new Event("input")); } }
});

/* theme */
function currentTheme(){ const t = document.documentElement.dataset.theme; return t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); }
function setThemeIcon(){ $("#themeBtn").innerHTML = I(currentTheme()==="dark" ? "sun" : "moon"); }
try { const saved = localStorage.getItem("hn-theme"); if(saved) document.documentElement.dataset.theme = saved; } catch(e){}
$("#themeBtn").addEventListener("click", () => {
  const next = currentTheme()==="dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("hn-theme", next); } catch(e){}
  setThemeIcon();
});

/* mobile nav */
$("#menuBtn").addEventListener("click", () => { const open = document.body.classList.toggle("nav-open"); $("#menuBtn").setAttribute("aria-expanded", open); });
$("#scrim").addEventListener("click", () => document.body.classList.remove("nav-open"));

buildNav(); setThemeIcon(); route();
window.addEventListener("hashchange", route);
})();
</script>
</body>
</html>
